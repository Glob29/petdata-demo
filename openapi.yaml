openapi: 3.1.0
info:
  title: PetData API
  version: 0.1.0
  description: |
    Демо-API двух справочников: Nutrition DB (корма и нутриенты) и Breed DB (породы
    и наследственные заболевания).

    Аутентификация в production: заголовок `X-API-Key`. В демо ключ не требуется,
    если не задан `PETDATA_API_KEY`.
servers:
  - url: http://127.0.0.1:8787
    description: Локальное демо
tags:
  - name: meta
  - name: products
  - name: breeds
  - name: nutrients

paths:
  /v1/health:
    get:
      tags: [meta]
      summary: Проверка доступности
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, const: ok }

  /v1/meta/coverage:
    get:
      tags: [meta]
      summary: Покрытие и свежесть данных
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Coverage' }
                  meta: { $ref: '#/components/schemas/Meta' }

  /v1/nutrients:
    get:
      tags: [nutrients]
      summary: Словарь нутриентов
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Nutrient' }
                  meta: { $ref: '#/components/schemas/Meta' }

  /v1/allergens:
    get:
      tags: [nutrients]
      summary: Группы аллергенов и источники белка
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      groups:
                        type: array
                        items:
                          type: object
                          properties:
                            code: { type: string }
                            name_ru: { type: string }
                            description: { type: string, nullable: true }
                            cross_reactivity_note: { type: string, nullable: true }
                      sources:
                        type: array
                        items:
                          type: object
                          properties:
                            code: { type: string }
                            name_ru: { type: string }
                            group_code: { type: string }
                            group_name: { type: string }
                            animal_origin: { type: boolean }
                            is_novel: { type: boolean }
                  meta: { $ref: '#/components/schemas/Meta' }

  /v1/products:
    get:
      tags: [products]
      summary: Список продуктов
      parameters:
        - $ref: '#/components/parameters/Species'
        - name: life_stage
          in: query
          schema: { type: string, enum: [puppy, kitten, adult, senior, all, unknown] }
        - name: brand
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: exclude_allergen
          in: query
          description: Исключить аллерген; для источника белка исключается вся группа (например, chicken → poultry)
          schema: { type: string }
        - name: protein_source
          in: query
          description: Только продукты с указанным источником или группой
          schema: { type: string }
        - name: hydrolyzed
          in: query
          description: true — есть гидролизованный компонент
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductSummary' }
                  meta: { $ref: '#/components/schemas/Meta' }

  /v1/products/{id}:
    get:
      tags: [products]
      summary: Карточка продукта
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProductDetail' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/products/{id}/nutrients:
    get:
      tags: [products]
      summary: Нутриенты продукта с пересчётом базиса
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: basis
          in: query
          schema:
            type: string
            enum: [as_fed, dm, per_1000_kcal]
            default: as_fed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      product_id: { type: integer }
                      basis: { type: string }
                      context:
                        type: object
                        properties:
                          moisture: { type: number, nullable: true }
                          me: { type: number, nullable: true }
                      nutrients:
                        type: array
                        items: { $ref: '#/components/schemas/NutrientValue' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/breeds:
    get:
      tags: [breeds]
      summary: Список пород
      parameters:
        - $ref: '#/components/parameters/Species'
        - name: size
          in: query
          schema: { type: string, enum: [mini, small, medium, large, giant] }
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BreedSummary' }
                  meta: { $ref: '#/components/schemas/Meta' }

  /v1/breeds/{id}:
    get:
      tags: [breeds]
      summary: Карточка породы
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BreedDetail' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/breeds/{id}/predispositions:
    get:
      tags: [breeds]
      summary: Наследственные предрасположенности породы
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Predisposition' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/search:
    get:
      tags: [meta]
      summary: Поиск по продуктам и породам
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items: { $ref: '#/components/schemas/ProductSummary' }
                      breeds:
                        type: array
                        items: { $ref: '#/components/schemas/BreedSummary' }
                  meta: { $ref: '#/components/schemas/Meta' }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Species:
      name: species
      in: query
      schema: { type: string, enum: [dog, cat] }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 0, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Meta:
      type: object
      properties:
        count: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        dataset_version: { type: string }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    Coverage:
      type: object
      properties:
        products: { type: integer }
        brands: { type: integer }
        products_with_protein: { type: integer }
        products_with_me: { type: integer }
        products_with_moisture: { type: integer }
        products_with_price: { type: integer }
        products_with_quality: { type: integer }
        breeds: { type: integer }
        dog_breeds: { type: integer }
        cat_breeds: { type: integer }
        predispositions: { type: integer }
        nutrients: { type: integer }
        last_updated: { type: string, nullable: true }

    Nutrient:
      type: object
      properties:
        code: { type: string }
        name_ru: { type: string }
        name_en: { type: string, nullable: true }
        unit: { type: string }
        category: { type: string }
        sort_order: { type: integer }

    KeyNutrient:
      type: object
      properties:
        amount: { type: number }
        unit: { type: string }
        value_type: { type: string }
        confidence: { type: number, nullable: true }

    ProductSummary:
      type: object
      properties:
        id: { type: integer }
        brand: { type: string }
        manufacturer: { type: string, nullable: true }
        line: { type: string, nullable: true }
        name: { type: string }
        gtin: { type: string, nullable: true }
        species: { type: string, enum: [dog, cat] }
        life_stage: { type: string, nullable: true }
        size_class: { type: string, nullable: true }
        form: { type: string, nullable: true }
        completeness: { type: string, nullable: true }
        therapeutic: { type: boolean }
        therapeutic_class: { type: string, nullable: true }
        market: { type: string }
        confidence: { type: number, nullable: true }
        updated_at: { type: string, nullable: true }
        price_range:
          type: object
          nullable: true
          properties:
            min: { type: number }
            max: { type: number }
            mid: { type: number }
            observations: { type: integer }
        protein_quality_score: { type: number, nullable: true }
        allergens:
          type: object
          properties:
            contains:
              type: array
              items: { type: string }
            groups:
              type: array
              items: { type: string }
            may_contain:
              type: array
              items: { type: string }
            hydrolyzed_components: { type: boolean }
            sources:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  name: { type: string }
                  group: { type: string }
                  group_name: { type: string }
                  role: { type: string, nullable: true }
                  declared_percent: { type: number, nullable: true }
                  hydrolyzed: { type: boolean }
                  confidence: { type: number, nullable: true }
            cross_reactivity:
              type: array
              items: { type: string }
        key_nutrients:
          type: object
          additionalProperties: { $ref: '#/components/schemas/KeyNutrient' }

    NutrientValue:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string }
        value_type: { type: string }
        confidence: { type: number, nullable: true }
        amount: { type: number, nullable: true }
        unit: { type: string }
        basis: { type: string }
        note: { type: string, nullable: true }

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          properties:
            nutrients:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  name_ru: { type: string }
                  unit: { type: string }
                  category: { type: string }
                  amount: { type: number }
                  basis: { type: string }
                  value_type: { type: string }
                  confidence: { type: number, nullable: true }
            ingredients:
              type: array
              items:
                type: object
                properties:
                  name_ru: { type: string }
                  name_en: { type: string, nullable: true }
                  animal_origin: { type: boolean, nullable: true }
                  allergen_group: { type: string, nullable: true }
                  position: { type: integer, nullable: true }
                  percent: { type: number, nullable: true }
                  percent_type: { type: string, nullable: true }
            packages:
              type: array
              description: >-
                Фасовки SKU. Если карточка продаётся в нескольких весах
                (например, 300 г, 1,5 кг и 10 кг), здесь будет несколько элементов,
                отсортированных по весу; отдельного поля «общий вес» нет.
              items:
                type: object
                properties:
                  weight_g: { type: number, description: Вес одной упаковки, г }
                  pack_count: { type: integer, description: Количество упаковок в мультипаке }
                  total_weight_g: { type: number, description: Вес всей упаковки, г (weight_g × pack_count) }
                  price_avg: { type: number, nullable: true, description: Средняя цена упаковки, ₽ }
                  price_per_g: { type: number, nullable: true, description: Цена за грамм, ₽/г — основная величина для сравнения фасовок }
                  price_samples: { type: integer, description: Сколько наблюдений цены усреднено }
                  price: { type: number, nullable: true }
                  currency: { type: string, nullable: true }
                  region: { type: string, nullable: true }
            price_snapshots:
              type: array
              items:
                type: object
                properties:
                  price: { type: number }
                  currency: { type: string }
                  region: { type: string, nullable: true }
                  retailer: { type: string, nullable: true }
                  url: { type: string, nullable: true }
                  observed_at: { type: string }
            metrics:
              type: object
              additionalProperties: true
              description: >-
                Цены по фасовкам: price_per_g (диапазон ₽/г), price_per_kg, price_per_100g,
                price_per_100g_protein, price_per_100kcal, best_value — самая выгодная фасовка.
                Считаются из средних цен упаковок. Отдельный блок observed_offers — минимум и
                максимум по конкретным наблюдениям цен (самое дешёвое предложение на рынке).
            quality:
              type: object
              nullable: true
              additionalProperties: true
              description: Источник белка, доля животного сырья, оценка 0–5 и флаги.
            claims:
              type: array
              items:
                type: object
                properties:
                  claim_type: { type: string, nullable: true }
                  text: { type: string }
            feeding_guide:
              type: array
              items:
                type: object
                properties:
                  weight_min_kg: { type: number, nullable: true }
                  weight_max_kg: { type: number, nullable: true }
                  grams_per_day: { type: number, nullable: true }
                  note: { type: string, nullable: true }

    BreedSummary:
      type: object
      properties:
        id: { type: integer }
        species: { type: string, enum: [dog, cat] }
        name: { type: string }
        name_en: { type: string, nullable: true }
        fci_group: { type: string, nullable: true }
        origin_country: { type: string, nullable: true }
        size_class: { type: string, nullable: true }
        height_cm:
          type: object
          properties:
            min: { type: number, nullable: true }
            max: { type: number, nullable: true }
        weight_kg:
          type: object
          properties:
            min: { type: number, nullable: true }
            max: { type: number, nullable: true }
        lifespan_years:
          type: object
          properties:
            min: { type: number, nullable: true }
            max: { type: number, nullable: true }
        coat:
          type: object
          properties:
            type: { type: string, nullable: true }
            length: { type: string, nullable: true }
            grooming_level: { type: string, nullable: true }
        brachycephalic: { type: boolean }
        exercise_level: { type: string, nullable: true }
        temperament: { type: string, nullable: true }

    Predisposition:
      type: object
      properties:
        code: { type: string }
        name_ru: { type: string }
        name_en: { type: string, nullable: true }
        category: { type: string, nullable: true }
        prevalence_text: { type: string, nullable: true }
        evidence_level: { type: string, enum: [A, B, C, D] }
        age_of_onset: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        source_id: { type: integer, nullable: true }

    BreedDetail:
      allOf:
        - $ref: '#/components/schemas/BreedSummary'
        - type: object
          properties:
            weights:
              type: array
              items:
                type: object
                properties:
                  sex: { type: string, nullable: true }
                  age_stage: { type: string, nullable: true }
                  min_kg: { type: number, nullable: true }
                  max_kg: { type: number, nullable: true }
            predispositions:
              type: array
              items: { $ref: '#/components/schemas/Predisposition' }
            genetic_tests:
              type: array
              items:
                type: object
                properties:
                  gene: { type: string, nullable: true }
                  mutation: { type: string, nullable: true }
                  inheritance: { type: string, nullable: true }
                  test_available: { type: boolean }
                  source_id: { type: integer, nullable: true }
